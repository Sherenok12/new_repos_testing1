name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install


      - name: Run tests
        run: npm test -- --json --outputFile=test-results.json

      - name: Upload test report
        if: success() || failure()   # навіть якщо тести впали
        uses: actions/upload-artifact@v4
        with:
          name: test-report          # ім’я артефакта
          path: test-results.json    # шлях до звіту
          if-no-files-found: ignore
