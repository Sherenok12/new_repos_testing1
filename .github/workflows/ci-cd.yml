name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'   # ← кешування npm-залежностей

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Збереження результатів тестів (наприклад, coverage)
      - name: Upload test artifacts
        if: success() || failure()   # навіть якщо тести впали
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
            junit.xml
          if-no-files-found: ignore

